<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slideshow Editor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="editor">

    <!-- LEFT PANEL: Images -->
    <aside class="panel panel-left">
      <h2>Images</h2>

      <div id="drop-zone" class="drop-zone">
        <p>Drop images here<br>or click to browse</p>
        <input type="file" id="file-input" multiple accept="image/jpeg,image/png" hidden>
      </div>

      <div class="image-actions">
        <span id="image-count">0 images</span>
        <button id="btn-clear" class="btn-sm" title="Remove all images">Clear</button>
      </div>

      <ul id="image-list" class="image-list"></ul>
    </aside>

    <!-- CENTER PANEL: Preview + Generate -->
    <main class="panel panel-center">
      <div class="preview-wrapper">
        <video id="video-preview" controls></video>
        <div id="preview-placeholder" class="preview-placeholder">
          <p>Upload images &amp; generate a video to preview it here</p>
        </div>
      </div>

      <div class="center-controls">
        <button id="btn-generate" class="btn-generate" disabled>Generate Video</button>
        <div id="progress" class="progress hidden">
          <div class="spinner"></div>
          <span id="progress-text">Generating...</span>
        </div>
        <a id="btn-download" class="btn-download hidden" download="slideshow.mp4">Download Video</a>
        <p class="duration-estimate">Estimated duration: <strong id="est-duration">--</strong></p>
      </div>
    </main>

    <!-- RIGHT PANEL: Settings -->
    <aside class="panel panel-right">
      <h2>Transition</h2>
      <div id="transition-grid" class="transition-grid"></div>

      <h2>Music</h2>
      <select id="music-select">
        <option value="">No music</option>
      </select>

      <h2>Settings</h2>

      <label>
        Duration per image
        <div class="slider-row">
          <input type="range" id="set-duration" min="1" max="10" step="0.5" value="3.5">
          <span id="val-duration">3.5s</span>
        </div>
      </label>

      <label>
        Transition duration
        <div class="slider-row">
          <input type="range" id="set-transition-dur" min="0.25" max="3" step="0.25" value="1.0">
          <span id="val-transition-dur">1.0s</span>
        </div>
      </label>

      <label>
        Resolution
        <select id="set-resolution">
          <option value="1920x1080" selected>1920x1080 (Full HD)</option>
          <option value="1280x720">1280x720 (HD)</option>
          <option value="3840x2160">3840x2160 (4K)</option>
          <option value="1080x1920">1080x1920 (Vertical HD)</option>
          <option value="720x1280">720x1280 (Vertical)</option>
        </select>
      </label>

      <label>
        Quality (CRF)
        <div class="slider-row">
          <input type="range" id="set-crf" min="0" max="51" step="1" value="18">
          <span id="val-crf">18</span>
        </div>
      </label>

      <label>
        Preset
        <select id="set-preset">
          <option value="ultrafast">ultrafast</option>
          <option value="superfast">superfast</option>
          <option value="veryfast">veryfast</option>
          <option value="faster">faster</option>
          <option value="fast">fast</option>
          <option value="medium">medium</option>
          <option value="slow" selected>slow</option>
          <option value="slower">slower</option>
          <option value="veryslow">veryslow</option>
        </select>
      </label>

      <label>
        FPS
        <select id="set-fps">
          <option value="24">24</option>
          <option value="30" selected>30</option>
          <option value="60">60</option>
        </select>
      </label>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
